<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Staff panel – DMI Diploma in English Hub</title>
<link rel="icon" href="assets/dmi-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
.count{background:var(--bad);color:#fff;border-radius:999px;padding:0 7px;font-size:12px;margin-left:4px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin:14px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-size:28px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.stat.warn{border-color:#f0a500;background:#fff8e6}
.pct{display:inline-block;min-width:44px;font-weight:800}
.bar2{height:8px;background:#ece8db;border-radius:6px;overflow:hidden;margin-top:4px;min-width:60px}
.bar2 i{display:block;height:100%;background:var(--ok)}
.bar2.mid i{background:#f0a500}.bar2.low i{background:var(--bad)}
.sub{font-size:12px;color:var(--muted);display:block}
a.rowlink{font-weight:700;text-decoration:none;border-bottom:1.5px solid var(--y)}
a.rowlink:hover{background:var(--y2)}
.skill{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.skill h4{margin:0 0 6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px}
.kv span{color:var(--muted)}
form.inline{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 12px;align-items:end}
tr.sel{background:var(--y2)}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a href="index.html"><img src="assets/dmi-logo.png" alt="DMI Computer Education – hub home"></a>
  <div><small>DIPLOMA IN ENGLISH</small><h1 id="ptitle">Staff panel</h1></div>
  <div class="who" id="who"></div>
</div></header>
<nav class="nav" id="nav" hidden aria-label="Staff sections"><div class="in" id="navin"></div></nav>
<div id="app"><div class="loading">Loading…</div></div>
<script src="assets/config.js"></script>
<script src="assets/staff.js"></script>
</body>
</html>
